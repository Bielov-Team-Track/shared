syntax = "proto3";

option csharp_namespace = "Shared.Contracts.Grpc";

package notifications;

service NotificationsInternalService {
  rpc SendPush (SendPushRequest) returns (SendPushResponse);
  rpc SendPushBatch (SendPushBatchRequest) returns (SendPushBatchResponse);
}

message SendPushRequest {
  string user_id = 1;
  string title = 2;
  string body = 3;
  map<string, string> data = 4;
}

message SendPushResponse {
  bool success = 1;
}

message SendPushBatchRequest {
  repeated SendPushRequest requests = 1;
}

message SendPushBatchResponse {
  int32 total_succeeded = 1;
  int32 total_failed = 2;
}
