syntax = "proto3";

option csharp_namespace = "Shared.Contracts.Grpc";

package clubs;

service ClubsInternalService {
  // Get members for notification purposes
  rpc GetClubMembers (GetClubMembersRequest) returns (GetClubMembersResponse);
  rpc GetGroupMembers (GetGroupMembersRequest) returns (GetGroupMembersResponse);
  rpc GetTeamMembers (GetTeamMembersRequest) returns (GetTeamMembersResponse);

  // For social-service: membership validation & suggestions
  rpc GetMembership (GetMembershipRequest) returns (GetMembershipResponse);
  rpc GetMemberSuggestions (GetMemberSuggestionsRequest) returns (GetMemberSuggestionsResponse);

  // For social-service: resolve a position mention (e.g. @setters) to member user ids
  rpc ResolvePositionMembers (ResolvePositionMembersRequest) returns (ResolvePositionMembersResponse);

  // Get club names by IDs
  rpc GetClubNames (GetClubNamesRequest) returns (GetClubNamesResponse);

  // For payments-service: check user's roles in a club
  rpc CheckUserClubRoles (CheckUserClubRolesRequest) returns (CheckUserClubRolesResponse);

  // For coaching-service: skill matrix data
  rpc GetSkillMatrix (GetSkillMatrixRequest) returns (GetSkillMatrixResponse);

  // For auth-service: check if user is sole owner of any club
  rpc CheckSoleOwnership (CheckSoleOwnershipRequest) returns (CheckSoleOwnershipResponse);

  // For events-service: resolve team/group context to parent club
  rpc ResolveClubId (ResolveClubIdRequest) returns (ResolveClubIdResponse);

  // For profiles-service: check whether the viewer can moderate / coach the target
  // (used to gate guardian visibility on /households/users/{id}/guardians).
  // Returns true iff one of: viewer is club Owner/Admin/HeadCoach in any of target's clubs;
  //                          viewer + target share a group AND viewer is GroupRole Admin/Coach/AssistantCoach;
  //                          viewer + target share a team  AND viewer is TeamRole  Admin/Manager/Coach/AssistantCoach.
  rpc CanModerateUser (CanModerateUserRequest) returns (CanModerateUserResponse);

  // Do two users share at least one active, VERIFIED club?
  //
  // Unverified clubs do NOT count. Anyone can create a club in seconds, so counting one
  // as a shared context turned club creation into a contact list of the whole platform.
  // Verification is set by hand in the database - no API grants it.
  //
  // Gates contact info (email/phone) visibility on public profile reads (profiles-service)
  // and opening a direct chat (messages-service).
  rpc UsersShareClub (UsersShareClubRequest) returns (UsersShareClubResponse);

  // What is A to B, and how far is each of them trusted?
  //
  // Answers in ONE round trip what messages-service needs to decide whether a direct
  // chat opens normally, opens as a request, or is refused. UsersShareClub is left
  // exactly as it is - profiles-service is a second consumer of it and gates contact
  // info on its current semantics.
  //
  // Every enum here has a DENY zero value, so a default-constructed response - the
  // shape a failed or unimplemented call produces - refuses rather than permits.
  rpc ResolveUserRelationship (ResolveUserRelationshipRequest) returns (ResolveUserRelationshipResponse);
}

// Which people a member list is being asked for. The zero value is Members and not an
// UNSPECIFIED sentinel on purpose: proto3 gives an absent field the zero value, and every
// caller that predates this enum means "the direct rows" - chat seeding, @everyone, post
// fan-out, event-invite seeding. An UNSPECIFIED zero would make all four of them ask a
// question nobody has answered, on the day the field ships.
enum Audience {
  AUDIENCE_MEMBERS   = 0;  // every direct row, any role
  AUDIENCE_PLAYERS   = 1;  // direct rows holding a playing role
  AUDIENCE_STAFF     = 2;  // direct rows holding a staff role
  AUDIENCE_GUARDIANS = 3;  // derived - guardians of the Members audience; each carries via_user_ids
  AUDIENCE_EVERYONE  = 4;  // Members U Guardians, deduped by user id
}

// === Club Members ===

message GetClubMembersRequest {
  string club_id = 1;
  repeated string exclude_user_ids = 2;
  Audience audience = 3;
}

message GetClubMembersResponse {
  repeated MemberInfo members = 1;
}

// === Group Members ===

message GetGroupMembersRequest {
  string group_id = 1;
  repeated string exclude_user_ids = 2;
  Audience audience = 3;
}

message GetGroupMembersResponse {
  repeated MemberInfo members = 1;
}

// === Team Members ===

message GetTeamMembersRequest {
  string team_id = 1;
  repeated string exclude_user_ids = 2;
  Audience audience = 3;
}

message GetTeamMembersResponse {
  repeated MemberInfo members = 1;
}

// === Membership Check ===

message GetMembershipRequest {
  string context_type = 1;  // Club, Group, Team
  string context_id = 2;
  string user_id = 3;
}

message GetMembershipResponse {
  bool is_member = 1;
  string role = 2;
  bool can_post = 3;
  bool can_comment = 4;
  bool can_view = 5;
  // Whether the user administers this context and may act on other members'
  // content in it. Answered here because `role` is only the single highest
  // role and its meaning differs per context type (a club Owner is reported
  // as `Coach` in a team), so callers cannot derive this from it.
  bool can_moderate = 6;

  // All DIRECT roles held in this context. Empty for a derived-only guardian.
  repeated string roles = 7;

  // Ward user ids whose direct standing in this context gives the principal derived
  // (guardian) standing. Empty means "not a guardian here".
  repeated string guardian_of = 8;
}

// === Member Suggestions ===

message GetMemberSuggestionsRequest {
  string context_type = 1;
  string context_id = 2;
  string query = 3;
  int32 limit = 4;
  Audience audience = 5;
}

message GetMemberSuggestionsResponse {
  repeated MemberSuggestion suggestions = 1;
  map<string, int32> position_counts = 2;  // VolleyballPosition name -> resolved member count
  int32 everyone_count = 3;
  // How many derived guardians this context has. Zero and "not offered here" are different
  // answers and the REST layer must keep them different.
  int32 guardians_count = 4;
}

// === Position Resolution ===

message ResolvePositionMembersRequest {
  string context_type = 1;                 // Club | Group | Team, or EMPTY for profile-only
  string context_id   = 2;
  string position     = 3;
  repeated string candidate_user_ids = 4;  // hard ceiling; REQUIRED when context_type is empty
}

message ResolvePositionMembersResponse {
  repeated string user_ids = 1;
}

// === Club Names ===

message GetClubNamesRequest {
  repeated string club_ids = 1;
}

message GetClubNamesResponse {
  repeated ClubNameInfo clubs = 1;
}

message ClubNameInfo {
  string club_id = 1;
  string name = 2;
  string logo_url = 3;
}

// === Common Messages ===

message MemberInfo {
  string user_id = 1;
  string display_name = 2;
  string role = 3;
  // Ward user ids this entry stands behind. NON-EMPTY means the entry is a DERIVED guardian
  // and holds no direct row here, so `role` is empty for it. Empty means an ordinary direct
  // member. Only ever populated for the Guardians and Everyone audiences.
  repeated string via_user_ids = 4;
}

message MemberSuggestion {
  string user_id = 1;
  string display_name = 2;
  string avatar_url = 3;
}

// === CheckUserClubRoles ===

message CheckUserClubRolesRequest {
  string user_id = 1;
  string club_id = 2;
}

message CheckUserClubRolesResponse {
  bool is_member = 1;
  repeated string roles = 2;  // Owner, Admin, Treasurer, HeadCoach, Coach, Member
}

// === Skill Matrix ===

message GetSkillMatrixRequest {
  string club_id = 1;
}

message GetSkillMatrixResponse {
  bool found = 1;
  string matrix_id = 2;
  repeated MatrixSkillProto skills = 3;
}

message MatrixSkillProto {
  string skill_id = 1;
  string name = 2;
  string skill_key = 3;
  repeated SkillBandProto bands = 4;
}

message SkillBandProto {
  string id = 1;
  int32 order = 2;
  string label = 3;
  double min_score = 4;
  double max_score = 5;
}

// === Sole Ownership Check ===

message CheckSoleOwnershipRequest {
  string user_id = 1;
}

message CheckSoleOwnershipResponse {
  bool is_sole_owner = 1;
  repeated string club_names = 2;
}

// === ResolveClubId ===

message ResolveClubIdRequest {
  string context_type = 1;  // "Club", "Team", "Group"
  string context_id = 2;
}

message ResolveClubIdResponse {
  string club_id = 1;
  bool found = 2;
}

// === CanModerateUser ===

message CanModerateUserRequest {
  string viewer_user_id = 1;
  string target_user_id = 2;
}

message CanModerateUserResponse {
  bool can_moderate = 1;
}

// === UsersShareClub ===

message UsersShareClubRequest {
  string viewer_user_id = 1;
  string target_user_id = 2;
}

message UsersShareClubResponse {
  bool shares_club = 1;
}

// === ResolveUserRelationship ===

enum RelationshipKind {
  RELATIONSHIP_NONE = 0;        // fail-closed default: no shared context worth anything
  RELATIONSHIP_SAME_TEAM = 1;   // shared active team inside a verified club
  RELATIONSHIP_SAME_GROUP = 2;  // shared active training group inside a verified club
  RELATIONSHIP_SAME_CLUB = 3;   // shared active membership in a verified club
  RELATIONSHIP_CROSS_CLUB = 4;  // both trusted, no shared verified club
}

enum TrustLevel {
  TRUST_UNTRUSTED = 0;  // fail-closed default: no active membership in any verified club
  TRUST_TRUSTED = 1;    // holds one
  TRUST_ELEVATED = 2;   // holds one AND carries responsibility in it
}

// Identity shown on a message-request card. Context, NOT an endorsement - the wording on
// the client must not imply the platform vouches for the sender.
message ClubBadge {
  string club_id = 1;
  string club_name = 2;
  string role = 3;        // highest ClubRole held, enum NAME (Owner, Admin, HeadCoach, ...)
  bool is_verified = 4;
  int32 member_count = 5;
}

message ResolveUserRelationshipRequest {
  string viewer_user_id = 1;
  string target_user_id = 2;
}

message ResolveUserRelationshipResponse {
  RelationshipKind relationship = 1;
  TrustLevel viewer_trust = 2;
  TrustLevel target_trust = 3;
  repeated ClubBadge viewer_clubs = 4;  // ranked, capped so the payload stays bounded
  int32 viewer_club_count = 5;          // total before the cap
}
